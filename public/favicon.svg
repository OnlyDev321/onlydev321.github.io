<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tran Hau (김진호) — Full-Stack Engineer">
  <!--
    Favicon — Tran Hau wordmark.
    Tri-color brand expressed as: cyan→purple gradient body, white "H" mark,
    gold editorial dot.
  -->
  <title>Tran Hau (김진호)</title>
  <desc>Bold "H" wordmark on a cyan-to-purple gradient with a gold accent dot.</desc>

  <defs>
    <!-- Brand gradient: cyan → mid blue → deep purple. The mid stop smooths
         the transition so the gradient doesn't band on small renders. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#22d3ee"/>
      <stop offset="0.50" stop-color="#5b6fe6"/>
      <stop offset="1"   stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Top-left specular gloss — gives depth at 32×32 and up. -->
    <radialGradient id="gloss" cx="0.25" cy="0.18" r="0.62">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft halo behind the gold accent dot. -->
    <radialGradient id="dotHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fbbf24" stop-opacity="0.72"/>
      <stop offset="1"   stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle bottom-right shadow for tactile depth. -->
    <radialGradient id="vignette" cx="0.78" cy="0.85" r="0.55">
      <stop offset="0"   stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Brand-gradient rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#brand)"/>

  <!-- 2. Bottom-right vignette (depth) -->
  <rect width="100" height="100" rx="22" fill="url(#vignette)"/>

  <!-- 3. Top-left gloss (depth) -->
  <rect width="100" height="100" rx="22" fill="url(#gloss)"/>

  <!-- 4. Inner hairline — defines the edge crisply at small sizes -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5"
        fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- 5. The letter H. text-anchor=middle, biased slightly left so the
         gold dot has its own corner. Font stack falls back to system bold
         on platforms that don't load Bricolage. -->
  <text x="42" y="76" text-anchor="middle"
        font-family="'Bricolage Grotesque', 'Inter Tight', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-weight="800" font-size="72" letter-spacing="-2"
        fill="#ffffff">H</text>

  <!-- 6. Gold editorial dot — the same period that closes "Tran Hau (김진호)."
         on the site. Halo-then-core for depth at larger sizes; collapses
         to a single warm pixel at 16×16. -->
  <circle cx="78" cy="78" r="14" fill="url(#dotHalo)"/>
  <circle cx="78" cy="78" r="6"  fill="#fbbf24"/>

  <!-- 7. Tiny specular dot on the gold — premium feel at 32×32+, invisible
         at 16×16. Pure white pixel at sub-pixel offset. -->
  <circle cx="76" cy="76" r="1.4" fill="#ffffff" fill-opacity="0.65"/>
</svg>
